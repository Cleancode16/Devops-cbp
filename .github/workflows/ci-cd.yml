name: CI/CD

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Trivy runs from a pinned image instead of a mutable action tag.
  TRIVY_IMAGE: aquasec/trivy:0.56.2

jobs:
  # 1 ─ ESLint + Prettier for both apps
  lint:
    name: Lint (${{ matrix.app }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        app: [server, client]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  # 2 ─ Jest + coverage (fails below 70%)
  test:
    name: Test (server)
    needs: lint
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: server
    env:
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Cache MongoDB binary for mongodb-memory-server
        uses: actions/cache@v4.1.2
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-7.0.14-${{ runner.os }}
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: coverage-report
          path: server/coverage/
          retention-days: 7

  # 3 ─ Dependency audit + Trivy filesystem scan
  security:
    name: Security scan
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Gate on what ships (runtime deps). Dev-only tooling (Jest 29, Tailwind v3 → braces)
      # has HIGH advisories with no fixed version, so it is reported but not blocking.
      - name: npm audit (server, runtime deps)
        working-directory: server
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (client, runtime deps)
        working-directory: client
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all deps, report only)
        run: |
          (cd server && npm audit --audit-level=high) || echo "::warning::server dev-dependency advisories (see log)"
          (cd client && npm audit --audit-level=high) || echo "::warning::client dev-dependency advisories (see log)"
      - name: Trivy filesystem scan
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            /src

  # 4 ─ Build, scan and push images (main only)
  build-push:
    name: Build & push (${{ matrix.app }})
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        app: [server, client]
    env:
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/eventpass-${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3.7.1
      - uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v6.9.0
        with:
          context: ${{ matrix.app }}
          load: true
          tags: ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            "$IMAGE:sha-${{ steps.vars.outputs.sha }}"
      - name: Push latest + sha tags
        uses: docker/build-push-action@v6.9.0
        with:
          context: ${{ matrix.app }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}

  # 5 ─ Deploy to EC2 (main only, skipped cleanly when SSH_HOST is not set)
  deploy:
    name: Deploy to EC2
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Skip (SSH_HOST secret not configured)
        if: env.SSH_HOST == ''
        run: echo "::notice::SSH_HOST secret is not set - skipping deploy."
      - name: Pull and restart stack over SSH
        if: env.SSH_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/eventpass
            docker compose pull
            docker compose up -d
            docker image prune -f
