name: eventpass

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - eventpass

  server:
    build: ./server
    image: ${DOCKER_USERNAME:-eventpass}/eventpass-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false # a fresh clone works without .env (dev defaults below)
    environment:
      PORT: 5000
      MONGO_URI: mongodb+srv://bharath:Bharath2005@cluster0.9gwtl.mongodb.net/devops
      # Dev-only fallback so `docker compose up` works from a fresh clone.
      # Set a real value in .env for anything beyond local development.
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:-dev-only-change-me}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5000/health > /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - eventpass

  client:
    build: ./client
    image: ${DOCKER_USERNAME:-eventpass}/eventpass-client:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      server:
        condition: service_healthy
    networks:
      - eventpass

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    depends_on:
      - server
    networks:
      - eventpass

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
    networks:
      - eventpass

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:

networks:
  eventpass:
    driver: bridge
