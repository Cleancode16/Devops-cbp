# Example only — kept fully commented so `kubectl apply -f k8s/` never applies a placeholder
# secret over the real one. Create the real secret with:
#
#   kubectl -n eventpass create secret generic eventpass-secret \
#     --from-literal=QR_SIGNING_SECRET="$(openssl rand -hex 32)"
#
# Or copy this file to k8s/secret.yaml (git-ignored), uncomment, set a base64 value, and apply it.
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: eventpass-secret
#   namespace: eventpass
# type: Opaque
# data:
#   QR_SIGNING_SECRET: <base64 of your secret>   # echo -n 'my-secret' | base64
