# Requires: minikube addons enable ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventpass
  namespace: eventpass
spec:
  ingressClassName: nginx
  rules:
    - host: eventpass.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 8080
