apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: eventpass
  labels:
    app: server
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # always keep full capacity during a rollout
  template:
    metadata:
      labels:
        app: server
    spec:
      terminationGracePeriodSeconds: 30 # server handles SIGTERM gracefully
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # "node" user in node:20-alpine
      containers:
        - name: server
          image: eventpass-server:latest
          imagePullPolicy: IfNotPresent # image is loaded with `minikube image load`
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: eventpass-config
            - secretRef:
                name: eventpass-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: eventpass
  labels:
    app: server
spec:
  selector:
    app: server
  ports:
    - name: http
      port: 5000
      targetPort: http
